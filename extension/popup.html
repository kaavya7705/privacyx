<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrivacyX Monitor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 320px; background: #0a0e1a; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
    .header { display: flex; align-items: center; gap: 8px; padding: 16px; border-bottom: 1px solid #243056; }
    .header svg { width: 24px; height: 24px; color: #00f0ff; }
    .header h1 { font-size: 16px; font-weight: 700; }
    .header h1 span { color: #00f0ff; }
    .status { padding: 16px; display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    .status-dot.active { background: #00ff88; box-shadow: 0 0 10px rgba(0,255,136,0.5); animation: pulse 2s ease-in-out infinite; }
    .status-dot.paused { background: #ffb800; }
    .status-dot.disconnected { background: #ff006e; }
    .status-text { font-size: 12px; color: #94a3b8; }
    .stats { padding: 0 16px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat { background: #1a2342; border: 1px solid #243056; border-radius: 8px; padding: 12px; }
    .stat-label { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 0.1em; }
    .stat-value { font-size: 20px; font-weight: 700; color: #00f0ff; margin-top: 4px; }
    .controls { padding: 0 16px 16px; }
    .btn { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid; font-size: 12px; font-weight: 600; cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.2s; }
    .btn-pause { background: rgba(255,184,0,0.1); border-color: rgba(255,184,0,0.3); color: #ffb800; margin-bottom: 8px; }
    .btn-pause:hover { background: rgba(255,184,0,0.2); }
    .btn-resume { background: rgba(0,255,136,0.1); border-color: rgba(0,255,136,0.3); color: #00ff88; margin-bottom: 8px; }
    .btn-sync { background: rgba(0,255,136,0.1); border-color: rgba(0,255,136,0.3); color: #00ff88; margin-bottom: 8px; }
    .btn-sync:hover { background: rgba(0,255,136,0.2); }
    .btn-dashboard { background: rgba(0,240,255,0.1); border-color: rgba(0,240,255,0.3); color: #00f0ff; }
    .btn-dashboard:hover { background: rgba(0,240,255,0.2); }
    .token-section { padding: 0 16px 16px; }
    .token-input { width: 100%; padding: 8px 12px; background: #0f1629; border: 1px solid #243056; border-radius: 6px; color: #e2e8f0; font-size: 11px; }
    .token-input:focus { outline: none; border-color: rgba(0,240,255,0.5); }
    .token-label { font-size: 10px; color: #64748b; margin-bottom: 4px; display: block; }
    .footer { padding: 12px 16px; border-top: 1px solid #243056; font-size: 10px; color: #64748b; text-align: center; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  </style>
</head>
<body>
  <div class="header">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
    <h1>Privacy<span>X</span> Monitor</h1>
  </div>

  <div class="status">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusText">Initializing...</span>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">Events Queued</div>
      <div class="stat-value" id="queueCount">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Total Sent</div>
      <div class="stat-value" id="totalCount">0</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-sync" id="syncBtn">⚡ Sync Events Now</button>
    <button class="btn btn-pause" id="toggleBtn">⏸ Pause Monitoring</button>
    <button class="btn btn-dashboard" id="dashboardBtn">Open Dashboard</button>
  </div>

  <div class="token-section">
    <label class="token-label">API Token</label>
    <input type="password" class="token-input" id="tokenInput" placeholder="Paste your API token here" />
  </div>

  <div class="footer">
    PrivacyX does not collect passwords, keystrokes, or private content.
  </div>

  <script src="popup.js"></script>
</body>
</html>
